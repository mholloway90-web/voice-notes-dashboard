<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#4A5560">
<title>Command Center · Voice Notes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<link rel="stylesheet" href="/styles.css">
</head>
<body>

<header class="top">
  <div class="top-inner">
    <a class="brand" href="#/jobs"><span class="mark">HGS</span><span>Command Center</span></a>
    <nav class="nav" aria-label="Main">
      <a href="#/jobs" data-nav="jobs">Jobs</a>
      <a href="#/loops" data-nav="loops">Open loops <span class="mono" id="nav-loops"></span></a>
      <a href="#/waiting" data-nav="waiting">Waiting on <span class="mono" id="nav-waiting"></span></a>
      <a href="#/vault" data-nav="vault">Vault</a>
    </nav>
    <form class="search" id="search-form" role="search">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
      <label class="sr" for="search-input">Search every note</label>
      <input id="search-input" type="search" placeholder="Search every note" autocomplete="off">
    </form>
    <button class="icon-btn" id="refresh-btn" type="button" aria-label="Refresh">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>
    </button>
  </div>
</header>

<main id="app" class="wrap" tabindex="-1">
  <div class="loading">Loading your notes…</div>
</main>

<nav class="tabbar" aria-label="Main">
  <a href="#/jobs" data-nav="jobs"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>Jobs</a>
  <a href="#/loops" data-nav="loops"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></svg>Loops</a>
  <a href="#/waiting" data-nav="waiting"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M7 3h10M7 21h10M8 3c0 5 8 5 8 9s-8 4-8 9"/></svg>Waiting</a>
  <a href="#/vault" data-nav="vault"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="5" width="18" height="15" rx="2"/><path d="M3 10h18"/></svg>Vault</a>
</nav>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="/app.js"></script>
</body>
</html>
